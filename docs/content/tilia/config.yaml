var:
  output: ../../dist
  assets: ../../assets
  model: ../../../tilia/llms.txt
  # Header marks are Tabler Icons (MIT) — see NOTICE.txt.
  wordmarkSvg: |-
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M5 21c.5 -4.5 2.5 -8 7 -10"/>
      <path d="M9 18c6.218 0 10.5 -3.288 11 -12v-2h-4.014c-9 0 -11.986 4 -12 9c0 1 0 3 2 5h3l.014 0"/>
    </svg>
  githubSvg: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 19c-4.3 1.4 -4.3 -2.5 -6 -3m12 5v-3.5c0 -1 .1 -1.4 -.5 -2c2.8 -.3 5.5 -1.4 5.5 -6a4.6 4.6 0 0 0 -1.3 -3.2a4.2 4.2 0 0 0 -.1 -3.2s-1.1 -.3 -3.5 1.3a12.3 12.3 0 0 0 -6.2 0c-2.4 -1.6 -3.5 -1.3 -3.5 -1.3a4.2 4.2 0 0 0 -.1 3.2a4.6 4.6 0 0 0 -1.3 3.2c0 4.6 2.7 5.7 5.5 6c-.6 .6 -.6 1.2 -.5 2v3.5"/></svg>
  faviconUrl: data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232e7d3a' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M5 21c.5 -4.5 2.5 -8 7 -10'/%3E%3Cpath d='M9 18c6.218 0 10.5 -3.288 11 -12v-2h-4.014c-9 0 -11.986 4 -12 9c0 1 0 3 2 5h3l.014 0'/%3E%3C/svg%3E
  prePaintScript: |-
    /* Language choice, resolved before first paint.
       Priority: ?lang= query parameter > localStorage > "ts". */
    (function () {
      var q = new URLSearchParams(location.search).get("lang");
      var saved = null;
      try { saved = localStorage.getItem("tilia-lang"); } catch (e) {}
      var lang = (q === "ts" || q === "res") ? q : (saved === "res" ? "res" : "ts");
      document.documentElement.setAttribute("data-lang", lang);
    })();
  toggleListenerScript: |-
    /* Language toggle: one delegated listener switches html[data-lang] and persists the choice.
       The buttons carry no state — CSS renders them from the attribute. */
    document.addEventListener("click", function (e) {
      if (!e.target.closest(".lang-toggle, .toggle")) return;
      var next = document.documentElement.getAttribute("data-lang") === "ts" ? "res" : "ts";
      document.documentElement.setAttribute("data-lang", next);
      try { localStorage.setItem("tilia-lang", next); } catch (err) {}
    });
  pkgSwitcherScript: |-
    /* Package switcher: a listbox of packages opened from its trigger. */
    (function () {
      var trigger = document.getElementById("pkg-trigger");
      var menu = document.getElementById("pkg-menu");
      var options = Array.prototype.slice.call(menu.querySelectorAll(".pkg-option"));
      function open() {
        menu.dataset.open = "true";
        trigger.setAttribute("aria-expanded", "true");
        (menu.querySelector('[aria-selected="true"]') || options[0]).focus();
      }
      function close(back) {
        delete menu.dataset.open;
        trigger.setAttribute("aria-expanded", "false");
        if (back) trigger.focus();
      }
      trigger.addEventListener("click", function (e) {
        e.stopPropagation();
        if (menu.dataset.open === "true") close(false);
        else open();
      });
      trigger.addEventListener("keydown", function (e) {
        if (e.key !== "ArrowDown" && e.key !== "Enter" && e.key !== " ") return;
        e.preventDefault();
        open();
      });
      menu.addEventListener("keydown", function (e) {
        var i = options.indexOf(document.activeElement);
        if (e.key === "Escape") close(true);
        else if (e.key === "ArrowDown") options[Math.min(i + 1, options.length - 1)].focus();
        else if (e.key === "ArrowUp") options[Math.max(i - 1, 0)].focus();
        else if (e.key === "Home") options[0].focus();
        else if (e.key === "End") options[options.length - 1].focus();
        else if (e.key === "Tab") return close(false);
        else return;
        e.preventDefault();
      });
      document.addEventListener("click", function (e) {
        if (menu.dataset.open !== "true") return;
        if (!menu.contains(e.target) && e.target !== trigger) close(false);
      });
    })();
  docsScrollSpyScript: |-
    /* Scroll-spy: highlight the current chapter in the reading path. */
    (function () {
      var links = {};
      document.querySelectorAll(".toc a[href^='#']").forEach(function (a) {
        links[a.hash.slice(1)] = a;
      });
      var spy = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) {
          if (!en.isIntersecting) return;
          Object.keys(links).forEach(function (id) { links[id].removeAttribute("aria-current"); });
          links[en.target.id].setAttribute("aria-current", "true");
        });
      }, { rootMargin: "-10% 0px -75% 0px" });
      document.querySelectorAll(".chapter[id]").forEach(function (s) { spy.observe(s); });
    })();
  toggleButton: <button class="lang-toggle" type="button" aria-label="Switch example language"><span class="lt lt-ts">TS</span><span class="lt lt-res">RES</span></button>
  signatureTs:
    value: "{{signature.ts}}"
    transform: typescript
  signatureRes:
    value: "{{signature.res}}"
    transform: rescript
  tagSpans:
    list: tags
    each: <span>{{item}}</span>
  refsBlock:
    list: refs
    each: <a href="./api.html#{{item}}">{{item}}</a>
    join: ", "
    template: '<p class="xref">Reference: {{body}} <span class="arrow">→</span></p>'
  homeCurrentAttr: ""
  guideCurrentAttr: ""
  apiCurrentAttr: ""
  rootHref: "./"
  currentPkg: tilia
  currentName: tilia
  chevronSvg: <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6l6 -6"/></svg>
  checkSvg: <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5l9 -9"/></svg>
  pkgSelected:
    value: "{{pkg}}|{{currentPkg}}"
    transform: same
  # One file per package in content/packages feeds the switcher menu.
  pkgOptions:
    dir: ../packages
    each: |-
      <li role="presentation"><a class="pkg-option" role="option" href="{{rootHref}}{{href}}" aria-selected="{{pkgSelected}}"><span class="pkg-option__text"><span class="pkg-option__name">{{scopedName}}</span><span class="pkg-option__desc">{{tagline}}</span></span>{{checkSvg}}</a></li>
  navLinks: |-
    <a href="./index.html"{{homeCurrentAttr}}>Home</a>
          <a href="./guide.html"{{guideCurrentAttr}}>Guide</a>
          <a href="./api.html"{{apiCurrentAttr}}>API</a>
  prePaint: ""
  skip: ""
  mainAttrs: ""
  scripts: ""
  header: |-
    <!-- Leaf, chevron, check, and GitHub marks: Tabler Icons (MIT) — see {{rootHref}}notice.txt -->
    <header class="top">
      <div class="wrap">
        <div class="header-left">
          <a class="wordmark" href="{{rootHref}}index.html" aria-label="tilia — home">{{wordmarkSvg}}tilia</a>
          <span class="brand-sep" aria-hidden="true">/</span>
          <div class="pkg-switcher">
            <button class="pkg-switcher__trigger" id="pkg-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="pkg-menu">
              <span class="pkg-switcher__current">{{currentName}}</span>{{chevronSvg}}
            </button>
            <ul class="pkg-switcher__menu" id="pkg-menu" role="listbox" aria-label="Select package" tabindex="-1">
              {{pkgOptions}}
            </ul>
          </div>
        </div>
        <nav class="nav" aria-label="{{currentName}}">
          {{navLinks}}
          <a class="nav__icon" href="https://github.com/tiliajs/tilia" aria-label="Source on GitHub">{{githubSvg}}</a>
        </nav>
      </div>
    </header>
    <script>{{pkgSwitcherScript}}</script>
  footer: |-
    <footer class="foot">
      <div class="wrap">
        <div class="fcell"><span class="lbl">Package</span><span class="val"><a href="https://www.npmjs.com/package/tilia">tilia on npm</a></span></div>
        <div class="fcell"><span class="lbl">Source</span><span class="val"><a href="https://github.com/tiliajs/tilia">github.com/tiliajs/tilia</a></span></div>
        <div class="fcell"><span class="lbl">License</span><span class="val">MIT</span></div>
        <div class="fcell"><span class="lbl">Method</span><span class="val"><a href="https://epuremethod.com">épure</a></span></div>
        <div class="fcell"><span class="lbl">Site</span><span class="val">tiliajs.dev</span></div>
      </div>
    </footer>
  shell: |-
    <!doctype html>
    <html {{htmlAttrs}}>
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{description}}">
    <title>{{title}}</title>
    <link rel="icon" href="{{faviconUrl}}">
    <link rel="stylesheet" href="./style.css">
    <link rel="alternate" type="text/plain" href="./llms.txt" title="tilia LLM documentation">
    {{prePaint}}
    </head>
    <body>
    {{skip}}
    {{header}}
    <main{{mainAttrs}}>
    {{main}}
    </main>
    {{footer}}
    {{scripts}}
    </body>
    </html>
  homeMain:
    file: home/index.html
  coreIndex:
    dir: api/core
    each: '        <a href="#{{slug}}">{{label}}</a>'
  coreEntries:
    dir: api/core
    transform: apiMd
    each: |-
      <article class="entry" id="{{slug}}">
        <header class="entry-head">
          <h2><a href="#{{slug}}">{{label}}</a></h2>
          <p class="tags"><span class="{{module}}">Core</span>{{tagSpans}}<span>Since {{since}}</span></p>
        </header>
        <p class="summary">{{summary}}</p>
        <div class="sig-wrap" data-pair>{{toggleButton}}{{signatureTs}}{{signatureRes}}</div>
        <div class="prose">{{body}}</div>
      </article>
  apiMain: |-
    <div class="api-head">
      <div class="wrap">
        <p class="eyebrow">Reference<span class="sep">·</span>v6.x<span class="sep">·</span>TypeScript &amp; ReScript signatures</p>
        <h1>API Reference</h1>
        <p class="sec-lead">The public surface of tilia. Each entry gives the signature, behavior, and one minimal example.</p>
      </div>
    </div>

    <div class="wrap api-layout">
      <nav class="api-index" aria-label="API index">
    <p class="k idx-group">Core</p>
        {{coreIndex}}
      </nav>
      <div class="api-entries">
    {{coreEntries}}
      </div>
    </div>
  toc:
    dir: guide
    each: '        <li><a href="#{{slug}}">{{title}}</a></li>'
  chapters:
    dir: guide
    transform: guideMd
    each: |-
      <section class="chapter" id="{{slug}}">
        <div class="ch-kicker"><span class="no">{{chapter}}</span><span class="rule"></span></div>
        <h2><a href="#{{slug}}">{{title}}</a></h2>
        {{body}}
        {{refsBlock}}
      </section>
  guideMain: |-
    <div class="docs-head">
      <div class="wrap">
        <p class="eyebrow">Guide<span class="sep">·</span>v6.x</p>
        <h1>The Guide</h1>
        <p class="standfirst">A reading path through tilia, in order: the mental model first, then tracking, computed values, observers, and the views that read them. Read it from top to bottom once. When you need to look something up later, use the <a href="./api.html">API reference</a> instead — it is flat, complete, and designed for that.</p>
      </div>
    </div>

    <div class="wrap docs-layout">
      <nav class="toc" aria-label="Chapters">
        <p class="k idx-group">Read in order</p>
        <ol>
    {{toc}}
        </ol>
      </nav>
      <div class="chapters">
    {{chapters}}
      </div>
    </div>
  errorsBody:
    file: errors.md
    transform: guideMd
  errorsMain: |-
    <div class="docs-head">
      <div class="wrap">
        <p class="eyebrow">Troubleshooting<span class="sep">·</span>Fail near the cause</p>
        <h1>Orphan computation error</h1>
        <p class="standfirst">A <code>computed</code> definition was used before it was inserted into a reactive object.</p>
      </div>
    </div>

    <div class="wrap docs-layout">
      <div class="chapters">
        <section class="chapter">
          <span id="1" aria-hidden="true"></span>
          <span id="orphan" aria-hidden="true"></span>
          {{errorsBody}}
        </section>
      </div>
    </div>
build:
  - output: "{{output}}/index.html"
    input: "{{shell}}"
    var:
      title: tilia — Domain-Driven State Management
      description: "tilia — domain-driven state management for TypeScript and ReScript. Reactive state in the domain's shape: plain objects and pure functions, observed directly by views."
      htmlAttrs: lang="en"
      homeCurrentAttr: ' aria-current="page"'
      main: "{{homeMain}}"
      scripts: |-
        <script>/* ts | res toggle on the hero code figure. */
        (function () {
          var fig = document.getElementById("hero-code");
          fig.querySelectorAll(".langswitch button").forEach(function (btn) {
            btn.addEventListener("click", function () {
              fig.setAttribute("data-lang", btn.dataset.lang);
              fig.querySelectorAll(".langswitch button").forEach(function (button) {
                button.setAttribute("aria-pressed", String(button === btn));
              });
            });
          });
        })();</script>
  - output: "{{output}}/errors.html"
    input: "{{shell}}"
    var:
      title: Orphan computation error — tilia
      description: Fix tilia's orphan computation error by inserting computed definitions directly into tilia or carve objects.
      htmlAttrs: lang="en" data-lang="ts"
      prePaint: <script>{{prePaintScript}}</script>
      skip: <a class="skip" href="#content">Skip to content</a>
      mainAttrs: ' id="content"'
      main: "{{errorsMain}}"
      scripts: <script>{{toggleListenerScript}}</script>
  - output: "{{output}}/api.html"
    input: "{{shell}}"
    var:
      title: API Reference — tilia
      description: tilia API reference — the complete public surface of the tilia state management library for TypeScript and ReScript.
      htmlAttrs: lang="en" data-lang="ts"
      apiCurrentAttr: ' aria-current="page"'
      prePaint: <script>{{prePaintScript}}</script>
      main: "{{apiMain}}"
      scripts: |-
        <script>{{toggleListenerScript}}</script>
        <script>/* React entries moved to their own package page. */
        (function () {
          var routes = {
            "#leaf": "./react/api.html#leaf",
            "#use-tilia": "./react/api.html#use-tilia",
            "#use-computed": "./react/api.html#use-computed",
            "#react-make": "./react/api.html#react-make",
            "#tilia-react-type": "./react/api.html#tilia-react-type"
          };
          var target = routes[location.hash];
          if (target) window.location.replace(target);
        })();</script>
  - output: "{{output}}/guide.html"
    input: "{{shell}}"
    var:
      title: The Guide — tilia
      description: The tilia guide — a reading path through the mental model, tracking, computed values, observers, and the views that read them.
      htmlAttrs: lang="en" data-lang="ts"
      guideCurrentAttr: ' aria-current="page"'
      prePaint: <script>{{prePaintScript}}</script>
      skip: <a class="skip" href="#content">Skip to content</a>
      mainAttrs: ' id="content"'
      main: "{{guideMain}}"
      scripts: |-
        <script>{{toggleListenerScript}}</script>
        <script>{{docsScrollSpyScript}}</script>
        <script>/* Legacy guide anchors. */
        (function () {
          var routes = {
            "#tilia": "./api.html#tilia",
            "#carve": "./api.html#carve",
            "#observe": "./api.html#observe",
            "#watch": "./api.html#watch",
            "#batch": "./api.html#batch",
            "#computed": "./api.html#computed",
            "#source": "./api.html#source",
            "#store": "./api.html#store",
            "#readonly": "./api.html#readonly",
            "#signal": "./api.html#signal",
            "#derived": "./api.html#derived",
            "#lift": "./api.html#lift",
            "#leaf": "./react/api.html#leaf",
            "#usetilia": "./react/api.html#use-tilia",
            "#useTilia": "./react/api.html#use-tilia",
            "#usecomputed": "./react/api.html#use-computed",
            "#useComputed": "./react/api.html#use-computed",
            "#installation": "./guide.html#the-kitchen-table",
            "#goals-and-non-goals": "./guide.html#drawn-before-built",
            "#goals": "./guide.html#drawn-before-built",
            "#ddd": "./guide.html#drawn-before-built",
            "#why-tilia-helps-with-domain-driven-design": "./guide.html#drawn-before-built",
            "#the-main-idea": "./guide.html#a-living-object",
            "#fundamental-concepts": "./guide.html#a-living-object",
            "#observer-pattern": "./guide.html#a-living-object",
            "#the-observer-pattern": "./guide.html#a-living-object",
            "#dependency-graph": "./guide.html#a-living-object",
            "#how-tilia-builds-the-dependency-graph": "./guide.html#a-living-object",
            "#functional-reactive-programming": "./guide.html#values-that-follow",
            "#carving": "./guide.html#carving-a-feature",
            "#carve-and-domain-driven-design": "./guide.html#carving-a-feature",
            "#source-derived-loader": "./guide.html#letting-the-world-in",
            "#derived-loader-inside-source": "./guide.html#letting-the-world-in",
            "#patterns": "./guide.html#a-small-vocabulary",
            "#flush-batching": "./guide.html#while-alice-sleeps",
            "#flush-strategy-and-batching": "./guide.html#while-alice-sleeps",
            "#mutations-computed": "./guide.html#while-alice-sleeps",
            "#mutations-in-computed-infinite-loop-risk": "./guide.html#while-alice-sleeps",
            "#react": "./react/index.html",
            "#react-integration": "./react/index.html",
            "#tilia-in-react": "./react/index.html",
            "#glue-zone": "./errors.html#orphan",
            "#the-glue-zone-and-security": "./errors.html#orphan",
            "#orphan-computations-problem": "./errors.html#orphan",
            "#garbage-collection": "./guide.html#mistakes-stay-small",
            "#error-handling": "./guide.html#mistakes-stay-small",
            "#technical-reference": "./guide.html#mistakes-stay-small",
            "#deep-technical-reference": "./guide.html#mistakes-stay-small"
          };
          var target = routes[location.hash];
          if (target) window.location.replace(target);
        })();</script>
  - output: "{{output}}/style.css"
    input:
      copy: "{{assets}}/style.css"
  - output: "{{output}}/fonts"
    input:
      copy: "{{assets}}/fonts"
  - output: "{{output}}/llms.txt"
    input:
      copy: "{{model}}"
  - output: "{{output}}/notice.txt"
    input:
      copy: ../../NOTICE.txt
