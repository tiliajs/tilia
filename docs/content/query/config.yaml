base: ../tilia/config.yaml
var:
  output: ../../dist/query
  assets: ../../assets
  model: ../../../query/llms.txt
  rootHref: "../"
  currentPkg: query
  currentName: "@tilia/query"
  footer: |-
    <footer class="foot">
      <div class="wrap">
        <div class="fcell"><span class="lbl">Package</span><span class="val"><a href="https://www.npmjs.com/package/@tilia/query">@tilia/query on npm</a></span></div>
        <div class="fcell"><span class="lbl">Source</span><span class="val"><a href="https://github.com/tiliajs/tilia">github.com/tiliajs/tilia</a></span></div>
        <div class="fcell"><span class="lbl">License</span><span class="val">MIT</span></div>
        <div class="fcell"><span class="lbl">Method</span><span class="val"><a href="https://epuremethod.com">épure</a></span></div>
        <div class="fcell"><span class="lbl">Site</span><span class="val">tiliajs.dev</span></div>
      </div>
    </footer>
  shell: |-
    <!doctype html>
    <html {{htmlAttrs}}>
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{description}}">
    <title>{{title}}</title>
    <link rel="icon" href="{{faviconUrl}}">
    <link rel="stylesheet" href="../style.css">
    <link rel="alternate" type="text/plain" href="./llms.txt" title="@tilia/query LLM documentation">
    {{prePaint}}
    </head>
    <body class="query">
    {{skip}}
    {{header}}
    <main{{mainAttrs}}>
    {{main}}
    </main>
    {{footer}}
    {{scripts}}
    </body>
    </html>
  homeMain:
    file: home/index.html
  coreIndex:
    dir: api/core
    each: '        <a href="#{{slug}}">{{label}}</a>'
  coreEntries:
    dir: api/core
    transform: apiMd
    each: |-
      <article class="entry" id="{{slug}}">
        <header class="entry-head">
          <h2><a href="#{{slug}}">{{label}}</a></h2>
          <p class="tags"><span class="{{module}}">Query</span>{{tagSpans}}<span>Since {{since}}</span></p>
        </header>
        <p class="summary">{{summary}}</p>
        <div class="sig-wrap" data-pair>{{toggleButton}}{{signatureTs}}{{signatureRes}}</div>
        <div class="prose">{{body}}</div>
      </article>
  apiMain: |-
    <div class="api-head">
      <div class="wrap">
        <p class="eyebrow">Reference<span class="sep">·</span>@tilia/query<span class="sep">·</span>TypeScript &amp; ReScript signatures</p>
        <h1>API Reference</h1>
        <p class="sec-lead">The public surface of @tilia/query. Each entry gives the signature, behavior, and one minimal example.</p>
      </div>
    </div>

    <div class="wrap api-layout">
      <nav class="api-index" aria-label="API index">
        <p class="k idx-group">Query</p>
        {{coreIndex}}
      </nav>
      <div class="api-entries">
        {{coreEntries}}
      </div>
    </div>
  toc:
    dir: guide
    each: '        <li><a href="#{{slug}}">{{title}}</a></li>'
  chapters:
    dir: guide
    transform: guideMd
    each: |-
      <section class="chapter" id="{{slug}}">
        <div class="ch-kicker"><span class="no">{{chapter}}</span><span class="rule"></span></div>
        <h2><a href="#{{slug}}">{{title}}</a></h2>
        {{body}}
        {{refsBlock}}
      </section>
  guideMain: |-
    <div class="docs-head">
      <div class="wrap">
        <p class="eyebrow">Guide<span class="sep">·</span>v0.x</p>
        <h1>The Guide</h1>
        <p class="standfirst">A reading path through @tilia/query, in order: remote data that reads like local state, then queries and views, the two-tier read, writing while offline, conflicts, and the adapter boundary. Read it from top to bottom once. When you need to look something up later, use the <a href="./api.html">API reference</a> instead — it is flat, complete, and made for that.</p>
      </div>
    </div>

    <div class="wrap docs-layout">
      <nav class="toc" aria-label="Chapters">
        <p class="k idx-group">Read in order</p>
        <ol>
        {{toc}}
        </ol>
      </nav>
      <div class="chapters">
        {{chapters}}
      </div>
    </div>
build:
  - output: "{{output}}/index.html"
    input: "{{shell}}"
    var:
      title: "@tilia/query — Remote Data That Feels Local"
      description: "@tilia/query — remote data that feels local. Query state on top of tilia: instant cached reads, background refresh, quiet sync, and a durable write outbox."
      htmlAttrs: lang="en"
      homeCurrentAttr: ' aria-current="page"'
      main: "{{homeMain}}"
      scripts: |-
        <script>/* ts | res toggle on the hero code figure. */
        (function () {
          var fig = document.getElementById("hero-code");
          fig.querySelectorAll(".langswitch button").forEach(function (btn) {
            btn.addEventListener("click", function () {
              fig.setAttribute("data-lang", btn.dataset.lang);
              fig.querySelectorAll(".langswitch button").forEach(function (button) {
                button.setAttribute("aria-pressed", String(button === btn));
              });
            });
          });
        })();</script>
  - output: "{{output}}/api.html"
    input: "{{shell}}"
    var:
      title: API Reference — @tilia/query
      description: "@tilia/query API reference — query state, caching, synchronization, and offline writes on top of tilia."
      htmlAttrs: lang="en" data-lang="ts"
      apiCurrentAttr: ' aria-current="page"'
      prePaint: <script>{{prePaintScript}}</script>
      main: "{{apiMain}}"
      scripts: <script>{{toggleListenerScript}}</script>
  - output: "{{output}}/guide.html"
    input: "{{shell}}"
    var:
      title: The Guide — @tilia/query
      description: The @tilia/query guide — remote data, cached reads, background refresh, offline writes, conflicts, and adapters.
      htmlAttrs: lang="en" data-lang="ts"
      guideCurrentAttr: ' aria-current="page"'
      prePaint: <script>{{prePaintScript}}</script>
      skip: <a class="skip" href="#content">Skip to content</a>
      mainAttrs: ' id="content"'
      main: "{{guideMain}}"
      scripts: |-
        <script>{{toggleListenerScript}}</script>
        <script>{{docsScrollSpyScript}}</script>
  - output: "{{output}}/style.css"
    input:
      copy: "{{assets}}/style.css"
  - output: "{{output}}/fonts"
    input:
      copy: "{{assets}}/fonts"
  - output: "{{output}}/llms.txt"
    input:
      copy: "{{model}}"
